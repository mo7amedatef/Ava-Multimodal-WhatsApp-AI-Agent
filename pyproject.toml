[project]
name = "ava-whatsapp-agent"
version = "0.1.0"
description = "Ava - Multimodal WhatsApp AI Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM & Orchestration
    "groq>=0.13.1",
    "langgraph>=0.2.60",
    "langchain>=0.3.13",
    "langchain-groq>=0.2.2",
    "langchain-community>=0.3.13",
    "langchain-openai>=0.2.14",

    # Checkpointing (short-term memory)
    "langgraph-checkpoint-sqlite>=2.0.1",
    "aiosqlite>=0.20.0",
    "supabase>=2.11.0",
    "langgraph-checkpoint-duckdb>=2.0.1",
    "duckdb>=1.1.3",

    # Interface
    "chainlit>=1.3.2",
    "fastapi[standard]>=0.115.6",

    # Memory & RAG
    "qdrant-client>=1.12.1",
    "sentence-transformers>=3.3.1",

    # Multimodal
    "elevenlabs>=1.50.3",
    "together>=1.3.10",

    # Utils
    "pydantic>=2.11",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pre-commit>=4.0.1",

    # Platform-specific
    "torch>=2.0.0,<2.3.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.0.0; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "numpy>=1.24.0,<2.0.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "numpy>=1.24.0; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]
ignore = ["E501"]